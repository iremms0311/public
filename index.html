<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A Special Surprise For Aaron ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #fce4ec;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .page-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease-in-out;
        }

        .page.active {
            opacity: 1;
            pointer-events: auto;
        }

        #page-lock { background-image: url('1-kilit.png'); }
        #page-boxes { background-image: url('2-kutular.png'); }
        #page-dragonball { background-image: url('3-dragonball.png'); }
        #page-letter { background-image: url('4-mektup.png'); }
        #page-playlist { background-image: url('5-playlist.png'); }
        #page-game { background-image: url('6-oyun.png'); }

        /* HOTSPOTS (Tıklanabilir Alanlar) */
        .hotspot {
            position: absolute;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .keypad-grid {
            position: absolute;
            bottom: 11%;
            left: 50%;
            transform: translateX(-50%);
            width: 320px;
            height: 380px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .key-touch {
            border-radius: 20px;
            cursor: pointer;
        }

        .key-touch:active {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Sağ Alt Tıklanabilir Alanlar (Exit / Back) */
        .btn-next-back {
            position: absolute;
            bottom: 3%;
            right: 4%;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            cursor: pointer;
        }

        /* Kutular Sayfasındaki 4 Sürpriz Kutu */
        .box-1 { top: 22%; left: 8%; width: 20%; height: 55%; }
        .box-2 { top: 22%; left: 30%; width: 20%; height: 55%; }
        .box-3 { top: 22%; left: 52%; width: 20%; height: 55%; }
        .box-4 { top: 22%; left: 74%; width: 20%; height: 55%; }

        /* Müzik Plak Butonu */
        #record-btn {
            position: absolute;
            top: 32%;
            left: 10%;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            cursor: pointer;
        }

        .record-rotate {
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* Oyundaki Kalp Yakalama */
        #catch-heart {
            position: absolute;
            font-size: 40px;
            cursor: pointer;
            animation: pulse 0.8s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.2); }
        }

        #score-display {
            position: absolute;
            top: 5%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            font-weight: bold;
            color: #d81b60;
        }
    </style>
</head>
<body>

    <div class="page-container">

        <!-- 1. KİLİT EKRANI -->
        <div id="page-lock" class="page active">
            <div class="keypad-grid">
                <div class="key-touch" data-key="1"></div>
                <div class="key-touch" data-key="2"></div>
                <div class="key-touch" data-key="3"></div>
                <div class="key-touch" data-key="4"></div>
                <div class="key-touch" data-key="5"></div>
                <div class="key-touch" data-key="6"></div>
                <div class="key-touch" data-key="7"></div>
                <div class="key-touch" data-key="8"></div>
                <div class="key-touch" data-key="9"></div>
                <div></div>
                <div class="key-touch" data-key="0"></div>
                <div class="key-touch" data-action="check"></div>
            </div>
        </div>

        <!-- 2. KUTULAR SAYFASI -->
        <div id="page-boxes" class="page">
            <div class="hotspot box-1" onclick="showPage('page-dragonball')"></div>
            <div class="hotspot box-2" onclick="showPage('page-letter')"></div>
            <div class="hotspot box-3" onclick="showPage('page-playlist')"></div>
            <div class="hotspot box-4" onclick="startGame()"></div>
        </div>

        <!-- 3. DRAGONBALL SAYFASI -->
        <div id="page-dragonball" class="page">
            <div class="hotspot btn-next-back" onclick="showPage('page-boxes')"></div>
        </div>

        <!-- 4. MEKTUP SAYFASI -->
        <div id="page-letter" class="page">
            <div class="hotspot btn-next-back" onclick="showPage('page-boxes')"></div>
        </div>

        <!-- 5. PLAYLIST SAYFASI -->
        <div id="page-playlist" class="page">
            <div id="record-btn"></div>
            <div class="hotspot btn-next-back" onclick="showPage('page-boxes')"></div>
        </div>

        <!-- 6. OYUN SAYFASI -->
        <div id="page-game" class="page">
            <div id="score-display">HEARTS: 0 / 5</div>
            <div id="game-area" style="width:100%; height:100%; position:relative;"></div>
            <div class="hotspot btn-next-back" onclick="showPage('page-boxes')"></div>
        </div>

    </div>

    <!-- MÜZİK SES DOSYASI -->
    <audio id="bg-music" src="song.mp3" loop></audio>

    <script>
        let enteredPin = "";
        const correctPin = "0807";
        let isPlaying = false;
        let score = 0;

        // SAYFA DEĞİŞTİRME FONKSİYONU
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            document.getElementById(pageId).classList.add('active');
        }

        // DOKUNMA VE TIKLAMA OLAYLARINI TEK ÇATI ALTINDA BİRLEŞTİRME (MOBİL VE IPAD UYUMLU)
        function bindTouchClick(element, handler) {
            let touchHandled = false;

            element.addEventListener('touchstart', function(e) {
                touchHandled = true;
                e.preventDefault();
                handler.call(this, e);
            }, { passive: false });

            element.addEventListener('click', function(e) {
                if (!touchHandled) {
                    handler.call(this, e);
                }
                touchHandled = false;
            });
        }

        // TUSLARA BASMA
        document.querySelectorAll('.key-touch').forEach(key => {
            bindTouchClick(key, function() {
                const keyValue = this.getAttribute('data-key');
                const actionValue = this.getAttribute('data-action');

                if (keyValue) {
                    if (enteredPin.length < 4) {
                        enteredPin += keyValue;
                    }
                } else if (actionValue === 'check') {
                    if (enteredPin === correctPin) {
                        showPage('page-boxes');
                    } else {
                        alert("Wrong PIN! Try again.");
                        enteredPin = "";
                    }
                }
            });
        });

        // TÜM DİĞER TIKLANABİLİR ALANLARI MOBİLE UYUMLU HALE GETİRMA
        document.querySelectorAll('.hotspot, .btn-next-back').forEach(el => {
            bindTouchClick(el, function() {
                if (this.onclick) {
                    this.onclick();
                }
            });
        });

        // PLAK / MÜZİK ÇALAR
        const music = document.getElementById('bg-music');
        const recordBtn = document.getElementById('record-btn');

        if (recordBtn) {
            bindTouchClick(recordBtn, function() {
                if (isPlaying) {
                    music.pause();
                    recordBtn.classList.remove('record-rotate');
                    isPlaying = false;
                } else {
                    music.play().then(() => {
                        recordBtn.classList.add('record-rotate');
                        isPlaying = true;
                    }).catch(err => {
                        console.log("Audio play error:", err);
                    });
                }
            });
        }

        // OYUN FONKSİYONLARI
        function startGame() {
            showPage('page-game');
            score = 0;
            document.getElementById('score-display').innerText = "HEARTS: 0 / 5";
            spawnHeart();
        }

        function spawnHeart() {
            const gameArea = document.getElementById('game-area');
            const oldHeart = document.getElementById('catch-heart');
            if (oldHeart) oldHeart.remove();

            if (score >= 5) {
                document.getElementById('score-display').innerText = "YOU WIN! ❤️";
                return;
            }

            const heart = document.createElement('div');
            heart.id = 'catch-heart';
            heart.innerHTML = '💖';

            const maxX = gameArea.clientWidth - 60;
            const maxY = gameArea.clientHeight - 60;

            const randomX = Math.max(20, Math.floor(Math.random() * maxX));
            const randomY = Math.max(50, Math.floor(Math.random() * maxY));

            heart.style.left = randomX + 'px';
            heart.style.top = randomY + 'px';

            bindTouchClick(heart, function() {
                score++;
                document.getElementById('score-display').innerText = "HEARTS: " + score + " / 5";
                spawnHeart();
            });

            gameArea.appendChild(heart);
        }
    </script>
</body>
</html>
