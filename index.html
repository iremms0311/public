<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Surprise For Aaron ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #fce4ec;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
        }

        /* Sabit 16:9 Oranlı Ana Kapsayıcı (Asla kaymaz, her ekranda ortalanır) */
        .screen-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 1200px;
            max-height: 675px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* 1. Sayfa: Kilit Ekranı */
        #page1 {
            background-image: url('1-kilit.png');
        }

        /* 2. Sayfa: Oyun Ekranı */
        #page2 {
            display: none;
            background-image: url('2-kutular.png');
        }

        /* Şifre Tuşları Alanı (Görseldeki tuşlarla birebir uyumlu konum) */
        .keypad {
            position: absolute;
            right: 7.5%;
            bottom: 10%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 290px;
            height: 240px;
        }

        .key {
            background: transparent;
            border: none;
            cursor: pointer;
        }

        /* Şifre Gösterge Alanı */
        #displayArea {
            position: absolute;
            right: 13%;
            top: 15.5%;
            font-size: 26px;
            color: #d81b60;
            font-weight: bold;
            letter-spacing: 18px;
        }

        /* Oyun Sayaç Yazısı (Mor çerçevenin üst kısmı) */
        #heartsCounter {
            position: absolute;
            top: 31.5%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 20px;
            color: #d81b60;
            font-weight: bold;
            text-align: center;
        }

        /* You Win Yazısı (Mor çerçevenin orta beyaz alanı) */
        #winMessage {
            display: none;
            position: absolute;
            top: 48%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 32px;
            color: #c2185b;
            font-weight: bold;
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 20px 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <!-- 1. SAYFA: KİLİT EKRANI -->
    <div class="screen-container" id="page1">
        <div id="displayArea"></div>
        
        <!-- Şifre Tuşları (1'den 9'a, Silme, 0 ve Onay) -->
        <div class="keypad">
            <button class="key" onclick="pressKey('1')"></button>
            <button class="key" onclick="pressKey('2')"></button>
            <button class="key" onclick="pressKey('3')"></button>
            <button class="key" onclick="pressKey('4')"></button>
            <button class="key" onclick="pressKey('5')"></button>
            <button class="key" onclick="pressKey('6')"></button>
            <button class="key" onclick="pressKey('7')"></button>
            <button class="key" onclick="pressKey('8')"></button>
            <button class="key" onclick="pressKey('9')"></button>
            <button class="key" onclick="clearCode()"></button>
            <button class="key" onclick="pressKey('0')"></button>
            <button class="key" onclick="submitCode()"></button>
        </div>
    </div>

    <!-- 2. SAYFA: OYUN VE MÜZİK EKRANI -->
    <div class="screen-container" id="page2">
        <div id="heartsCounter">HEARTS: 0 / 5</div>
        <div id="winMessage">YOU WIN! ❤️</div>
    </div>

    <!-- Arkaplan Müzik Dosyası -->
    <audio id="bgMusic" loop>
        <source src="lovesong.mp3" type="audio/mpeg">
    </audio>

    <script>
        let enteredCode = "";
        const correctCode = "0807";
        let collectedHearts = 0;

        function pressKey(digit) {
            // İlk tuşlamada müzik çalmaya başlar
            const music = document.getElementById('bgMusic');
            music.play().catch(e => console.log("Müzik çalma hatası:", e));

            if (enteredCode.length < 4) {
                enteredCode += digit;
                updateDisplay();
            }
        }

        function clearCode() {
            enteredCode = "";
            updateDisplay();
        }

        function updateDisplay() {
            // Şifre alanına yıldız veya girilen rakamlar maskelenerek yazılır
            document.getElementById('displayArea').innerText = "❤️".repeat(enteredCode.length);
        }

        function submitCode() {
            if (enteredCode === correctCode) {
                // Doğru şifre: 2. sayfaya geç
                document.getElementById('page1').style.display = 'none';
                document.getElementById('page2').style.display = 'block';
            } else {
                alert("Yanlış şifre aşkım, tekrar dene ❤️");
                clearCode();
            }
        }
    </script>
</body>
</html>
